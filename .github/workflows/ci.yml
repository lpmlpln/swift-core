name: Core

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        if: matrix.os == 'ubuntu-latest'
        with:
          swift-version: "6.0"
      - run: swift build
      - run: swift test
